version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    groups:
      test:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "coverlet*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    groups:
      # init va analyze PHAI cung phien ban - tach PR la ca hai PR deu do (da gap: #8, #9).
      codeql:
        patterns: ["github/codeql-action*"]
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    groups:
      website:
        patterns: ["*"]
