name: Phat hanh

# Gan tag vYY.M.DDNN tren main ->
#   build (Windows): test, dong goi tsudisk.exe, chay lai E2E VHDX, kiem thong tin phien ban trong exe, dat ten theo
#     VERSIONING.md v3 ({goi}_{ver}_{os}-{arch}-{loai}).
#   publish (Linux): SBOM SPDX, SHA256SUMS.txt ky keyless Sigstore (SHA256SUMS.txt.sigstore.json), chung thuc nguon goc
#     build (GitHub Artifact Attestation) cho exe + SBOM, tao GitHub Release. DISTRIBUTION_TRUST.md muc 2.
on:
  push:
    tags: ['v[0-9][0-9].*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - name: Tag khop VersionPrefix va khuon v3
        id: ver
        shell: pwsh
        run: |
          $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.VersionPrefix | Where-Object { $_ } | Select-Object -First 1
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} khac VersionPrefix $v" }
          if ("${{ github.ref_name }}" -notmatch '^v[0-9]{2}\.[1-9][0-9]?\.[0-3][0-9][0-9]{2}(-(beta|rc)\.[0-9]+)?$') { throw "Tag lech khuon VERSIONING.md 2.2" }
          "version=$v" | Out-File -Append $env:GITHUB_OUTPUT
      - name: Test don vi
        run: dotnet test tests/TsuDisk.Core.Tests -c Release
      - name: Dong goi
        run: dotnet publish src/TsuDisk.Cli -c Release -r win-x64 -o publish
      - name: Thong tin phien ban trong exe (DISTRIBUTION_TRUST 1.1.4)
        shell: pwsh
        run: ./scripts/kiem-thong-tin-exe.ps1 -Exe publish/tsudisk.exe -Version "${{ steps.ver.outputs.version }}"
      - name: E2E tren o ao VHDX
        shell: powershell
        run: ./tests/e2e/run-e2e.ps1 -Exe ./publish/tsudisk.exe
      - name: Dat ten
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item publish/tsudisk.exe "dist/tsudisk_${{ steps.ver.outputs.version }}_windows-x64-portable.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Khoi phuc goi NuGet (de SBOM doc project.assets.json)
        run: dotnet restore src/TsuDisk.Cli -r win-x64
      - name: SBOM (SPDX) cua ma nguon va goi phu thuoc
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/tsudisk_${{ env.VERSION }}_sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Ky SHA256SUMS.txt (Sigstore keyless)
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.txt.sigstore.json SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/tsudisk_*.exe
            dist/tsudisk_*_sbom.spdx.json
      - name: Tao GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '/^## \[/{p = index($0, "## [" v "]") == 1} p' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ### Kiểm tra tệp tải về

          ```bash
          sha256sum -c SHA256SUMS.txt --ignore-missing
          cosign verify-blob SHA256SUMS.txt --bundle SHA256SUMS.txt.sigstore.json \
            --certificate-identity-regexp '^https://github.com/tsudev-org/tsudisk/\.github/workflows/release\.yml@refs/tags/v' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify tsudisk_*_windows-x64-portable.exe --repo tsudev-org/tsudisk
          ```
          EOF
          gh release create "$TAG" dist/* --title "TsuDisk $VERSION" --notes-file notes.md
