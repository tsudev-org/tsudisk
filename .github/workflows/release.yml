name: Phat hanh

# Gan tag vYY.M.DDNN tren main ->
#   build (Windows): test, dong goi tsudisk.exe (CLI) + tsudisk-gui.exe (giao dien, ADR-0008), chay lai E2E VHDX,
#     kiem thong tin phien ban trong ca hai exe, chup thu giao dien (du lieu mau), dat ten theo VERSIONING.md v3
#     ({goi}_{ver}_{os}-{arch}-{loai}): tsudisk_{ver}_windows-x64-portable.exe, tsudisk-gui_{ver}_windows-x64-portable.exe.
#   publish (Linux): SBOM SPDX, SHA256SUMS.txt ky keyless Sigstore (SHA256SUMS.txt.sigstore.json), chung thuc nguon goc
#     build (GitHub Artifact Attestation) cho exe + SBOM, tao GitHub Release o dang NHAP. DISTRIBUTION_TRUST.md muc 2.
#   virustotal: workflow dung chung tsudev-org/.github quet exe, ghi link bao cao vao Release notes (muc 3).
#   cong-bo: 0 engine gan co (hoac chua co VT_API_KEY) => xuat ban Release. Bi gan co / loi => giu nhap + mo Issue.
#   winget: (khong chay cho the thu) nop manifest vao microsoft/winget-pkgs bang packaging/tools/winget-submit.mjs,
#     token WINGET_TOKEN nam trong Environment `packages` (chi the v*). Chua co token => bo qua.
# The thu `vYY.M.DDNN-beta.N` / `-rc.N` (VERSIONING.md 2.2): VersionPrefix = phan truoc dau '-', Release la Pre-release,
#   khong sinh manifest winget.
on:
  push:
    tags: ['v[0-9][0-9].*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.ver.outputs.version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - name: Tag khop VersionPrefix va khuon v3
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v([0-9]{2}\.[1-9][0-9]?\.[0-3][0-9][0-9]{2})(-((beta|rc)\.[0-9]+))?$') { throw "Tag lech khuon VERSIONING.md 2.2" }
          $base = $Matches[1]; $suffix = $Matches[3]
          $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.VersionPrefix | Where-Object { $_ } | Select-Object -First 1
          if ($base -ne $v) { throw "Tag $tag khac VersionPrefix $v" }
          "version=$($tag.Substring(1))" | Out-File -Append $env:GITHUB_OUTPUT
          "suffix=$suffix" | Out-File -Append $env:GITHUB_OUTPUT
          "prerelease=$(if ($suffix) { 'true' } else { 'false' })" | Out-File -Append $env:GITHUB_OUTPUT
      - name: Test don vi
        run: dotnet test tests/TsuDisk.Core.Tests -c Release
      - name: Dong goi
        env:
          SUFFIX: ${{ steps.ver.outputs.suffix }}
        run: dotnet publish src/TsuDisk.Cli -c Release -r win-x64 -o publish -p:VersionSuffix=$env:SUFFIX
      - name: Dong goi giao dien tsudisk-gui.exe (ADR-0008)
        env:
          SUFFIX: ${{ steps.ver.outputs.suffix }}
        run: dotnet publish src/TsuDisk.Gui -c Release -r win-x64 -o publish-gui -p:VersionSuffix=$env:SUFFIX
      - name: Thong tin phien ban trong exe (DISTRIBUTION_TRUST 1.1.4)
        shell: pwsh
        run: |
          ./scripts/kiem-thong-tin-exe.ps1 -Exe publish/tsudisk.exe -Version "${{ steps.ver.outputs.version }}"
          ./scripts/kiem-thong-tin-exe.ps1 -Exe publish-gui/tsudisk-gui.exe -Version "${{ steps.ver.outputs.version }}" -BoQuaChay
      - name: Giao dien khoi dong duoc (chup du lieu mau, khong doc/ghi dia)
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'gui-thu'
          $p = Start-Process -FilePath publish-gui/tsudisk-gui.exe -ArgumentList @('--du-lieu-mau', '--chup-man-hinh', $out) -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content (Join-Path $out 'loi.txt') -ErrorAction SilentlyContinue; throw "tsudisk-gui ma thoat $($p.ExitCode)" }
          if ((Get-ChildItem $out -Filter 'tsudisk-gui_*.png').Count -lt 4) { throw 'tsudisk-gui chup thieu anh' }
      - name: E2E tren o ao VHDX
        shell: powershell
        run: ./tests/e2e/run-e2e.ps1 -Exe ./publish/tsudisk.exe
      - name: Dat ten
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item publish/tsudisk.exe "dist/tsudisk_${{ steps.ver.outputs.version }}_windows-x64-portable.exe"
          Copy-Item publish-gui/tsudisk-gui.exe "dist/tsudisk-gui_${{ steps.ver.outputs.version }}_windows-x64-portable.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Khoi phuc goi NuGet (de SBOM doc project.assets.json)
        run: |
          dotnet restore src/TsuDisk.Cli -r win-x64 --locked-mode
          dotnet restore src/TsuDisk.Gui -r win-x64 -p:EnableWindowsTargeting=true --locked-mode
      - name: SBOM (SPDX) cua ma nguon va goi phu thuoc
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/tsudisk_${{ env.VERSION }}_sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Ky SHA256SUMS.txt (Sigstore keyless)
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.txt.sigstore.json SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/tsudisk_*.exe
            dist/tsudisk-gui_*.exe
            dist/tsudisk_*_sbom.spdx.json
      - name: Tao GitHub Release (NHAP - chi xuat ban sau khi VirusTotal sach)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '/^## \[/{p = index($0, "## [" v "]") == 1} p' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ### Kiểm tra tệp tải về

          ```bash
          sha256sum -c SHA256SUMS.txt --ignore-missing
          cosign verify-blob SHA256SUMS.txt --bundle SHA256SUMS.txt.sigstore.json \
            --certificate-identity-regexp '^https://github.com/tsudev-org/tsudisk/\.github/workflows/release\.yml@refs/tags/v' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify tsudisk_*_windows-x64-portable.exe --repo tsudev-org/tsudisk
          gh attestation verify tsudisk-gui_*_windows-x64-portable.exe --repo tsudev-org/tsudisk
          ```
          EOF
          pre=(); [[ "$PRERELEASE" == "true" ]] && pre=(--prerelease)
          # Chay lai job: Release nhap da co thi chi tai lai tep.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft "${pre[@]}" --title "TsuDisk $VERSION" --notes-file notes.md
          fi
      - name: Manifest winget (sinh tu packaging/package.json, dinh kem Release)
        if: needs.build.outputs.prerelease != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node packaging/tools/winget-manifest.mjs --version "$VERSION" --sums dist/SHA256SUMS.txt --out winget-out \
            --date "$(TZ=Asia/Ho_Chi_Minh date +%F)"
          (cd winget-out && zip -qr "../tsudisk_${VERSION}_winget-manifest.zip" manifests)
          gh release upload "$TAG" "tsudisk_${VERSION}_winget-manifest.zip" --clobber

  virustotal:
    needs: publish
    permissions:
      contents: write
    # tsudev-org/.github @ 8a393eb (feat(ci): workflow dung chung quet VirusTotal, #4)
    uses: tsudev-org/.github/.github/workflows/virustotal.yml@8a393ebd89349300637c8c57e89c12492b174e4d
    with:
      tag: ${{ github.ref_name }}
      patterns: tsudisk_*.exe tsudisk-gui_*.exe
    secrets:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}

  cong-bo:
    needs: [build, virustotal]
    if: needs.virustotal.outputs.flagged != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Xuat ban Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          FLAGGED: ${{ needs.virustotal.outputs.flagged }}
          LATEST: ${{ needs.build.outputs.prerelease == 'true' && 'false' || 'true' }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest="$LATEST"
          echo "### Release $TAG da xuat ban (VirusTotal: $FLAGGED)" >> "$GITHUB_STEP_SUMMARY"

  bao-loi:
    needs: [publish, virustotal, cong-bo]
    if: failure() && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Mo Issue - Release dang giu o nhap
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FLAGGED: ${{ needs.virustotal.outputs.flagged }}
        run: |
          set -euo pipefail
          cat > body.md <<EOF
          Release \`$TAG\` đang giữ ở **nháp**, chưa xuất bản (VirusTotal: \`${FLAGGED:-loi}\`).

          - Lượt chạy: $RUN
          - Bị gắn cờ: nộp báo nhầm theo \`.standards/docs/DISTRIBUTION_TRUST.md\` mục 3, ghi kết quả vào \`logs/\`.
          - Lỗi khác (hết giờ chờ, API): chạy lại job \`virustotal\` của lượt trên.
          EOF
          gh issue create -R "$GITHUB_REPOSITORY" --title "Phát hành $TAG giữ ở nháp" --body-file body.md

  winget:
    needs: [build, cong-bo]
    if: needs.build.outputs.prerelease != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: packages
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Nop manifest vao microsoft/winget-pkgs
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "${WINGET_TOKEN:-}" ]]; then
            echo "::notice::Chua co WINGET_TOKEN trong Environment packages - bo qua nop winget."
            exit 0
          fi
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "tsudisk_${VERSION}_winget-manifest.zip" -D wm
          (cd wm && unzip -q ./*.zip)
          node packaging/tools/winget-submit.mjs --root wm --version "$VERSION" | tee -a "$GITHUB_STEP_SUMMARY"
