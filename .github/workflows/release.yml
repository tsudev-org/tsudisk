name: Phat hanh

# Gan tag vYY.M.DDNN tren main -> build tsudisk.exe tren Windows, chay lai E2E VHDX, dat ten theo VERSIONING.md + phieu toan he 20261117-V1 ({goi}_{ver}_{os}-{arch}-{loai}),
# sinh SHA256SUMS.txt, chung thuc nguon goc build (GitHub Artifact Attestation), tao GitHub Release.
on:
  push:
    tags: ['v[0-9][0-9].*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - name: Tag khop VersionPrefix
        shell: pwsh
        run: |
          $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.VersionPrefix | Where-Object { $_ } | Select-Object -First 1
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} khac VersionPrefix $v" }
          "VERSION=$v" | Out-File -Append $env:GITHUB_ENV
      - name: Test don vi
        run: dotnet test tests/TsuDisk.Core.Tests -c Release
      - name: Dong goi
        run: dotnet publish src/TsuDisk.Cli -c Release -r win-x64 -o publish
      - name: E2E tren o ao VHDX
        shell: powershell
        run: ./tests/e2e/run-e2e.ps1 -Exe ./publish/tsudisk.exe
      - name: Dat ten + SHA256SUMS
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          $name = "tsudisk_$($env:VERSION)_windows-x64-portable.exe"
          Copy-Item publish/tsudisk.exe "dist/$name"
          Get-ChildItem dist | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/tsudisk_*.exe
      - name: Tao GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = (Get-Content CHANGELOG.md -Raw) -split '(?m)^## ' | Where-Object { $_ -like "[$($env:VERSION)]*" } | Select-Object -First 1
          gh release create "${{ github.ref_name }}" dist/* --title "TsuDisk $($env:VERSION)" --notes "## $notes"
